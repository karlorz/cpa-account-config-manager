# Fork releases use vX.Y.Z-N only (e.g. v0.3.1332-0). Upstream owns plain
# vX.Y.Z tags on Mxucc/cpa-account-config-manager; never create or replace them.
name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork tag vX.Y.Z-N to build or repair
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Check fork tag policy
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: Mxucc/cpa-account-config-manager
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate fork tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Tag '${tag}' violates the fork tag policy: fork release tags must be vX.Y.Z-N (e.g. v0.3.1332-0, v0.3.1332-1). Never create or replace upstream's plain vX.Y.Z tags."
            exit 1
          fi
          if ! upstream_tag="$(git ls-remote --tags "https://github.com/${UPSTREAM_REPO}.git" "refs/tags/${tag}")"; then
            echo "::error::Could not verify whether tag '${tag}' exists upstream (${UPSTREAM_REPO}). Refusing to release without a successful upstream collision check."
            exit 1
          fi
          if [[ -n "${upstream_tag}" ]]; then
            echo "::error::Tag '${tag}' already exists upstream (${UPSTREAM_REPO}). Pick the next fork-series name (vX.Y.Z-N)."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify release source
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0

      - name: Verify annotated release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [[ "$(git cat-file -t "${RELEASE_TAG}")" != "tag" ]]; then
            echo "release tag must be annotated: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ -z "$(git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}" | tr -d '[:space:]')" ]]; then
            echo "annotated release tag has no release notes: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify registry release identity
        run: make release-version-check VERSION=${{ needs.check.outputs.version }}

      - name: Verify release
        run: make verify VERSION=${{ needs.check.outputs.version }}

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [check, verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: dll

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build native plugin
        shell: bash
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          go build \
            -buildvcs=false \
            -ldflags "-X cpa-account-config-manager/internal/manager.PluginVersion=${VERSION} -X cpa-account-config-manager/internal/manager.PluginRepository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -buildmode=c-shared \
            -o "dist/cpa-account-config-manager.${{ matrix.ext }}" \
            .

      - name: Verify target platform
        shell: bash
        run: |
          go version -m "dist/cpa-account-config-manager.${{ matrix.ext }}" | tee build-info.txt
          grep -q "GOOS=${{ matrix.goos }}" build-info.txt
          grep -q "GOARCH=${{ matrix.goarch }}" build-info.txt

      - name: Package release archive
        shell: bash
        run: |
          go run ./cmd/releasepack \
            -version "${{ needs.check.outputs.version }}" \
            -goos "${{ matrix.goos }}" \
            -goarch "${{ matrix.goarch }}" \
            -library "dist/cpa-account-config-manager.${{ matrix.ext }}" \
            -ui internal/web/dist/index.html \
            -out dist/release

      - name: Verify packaged archive
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          archive="dist/release/cpa-account-config-manager_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          go run ./cmd/releaseverify \
            -version "${VERSION}" \
            -goos "${{ matrix.goos }}" \
            -goarch "${{ matrix.goarch }}" \
            -repository "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -registry registry.json \
            -archive "${archive}" \
            -checksum "${archive}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: cpa-account-config-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0

      - name: Read release notes from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          if [[ "$(git cat-file -t "${RELEASE_TAG}")" != "tag" ]]; then
            echo "release tag must be annotated: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/${RELEASE_TAG}" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "annotated release tag has no release notes: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Verify artifact set and generate aggregate checksums
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd assets
          archives=(
            "cpa-account-config-manager_${VERSION}_darwin_arm64.zip"
            "cpa-account-config-manager_${VERSION}_linux_amd64.zip"
            "cpa-account-config-manager_${VERSION}_linux_arm64.zip"
            "cpa-account-config-manager_${VERSION}_windows_amd64.zip"
          )
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -type f -name '*.zip.sha256' | wc -l)" -eq 4
          for archive in "${archives[@]}"; do
            test -f "${archive}"
            test -f "${archive}.sha256"
            sha256sum -c "${archive}.sha256"
          done
          sha256sum "${archives[@]}" > checksums.txt
          cat checksums.txt

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "CPA Account Config Manager ${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" assets/*.zip assets/*.sha256 assets/checksums.txt --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "CPA Account Config Manager ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              assets/*.zip \
              assets/*.sha256 \
              assets/checksums.txt
          fi
